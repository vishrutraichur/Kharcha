<title>Kharcha</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1b1d1b; --mute:#6d716c; --line:#e5e3dc;
  --accent:#1f7a52; --accent-ink:#ffffff; --accent-soft:#e3f1e9; --danger:#b8402f; --chip:#efede7;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121412; --card:#1c1f1c; --ink:#ecefea; --mute:#99a097; --line:#2c312c;
    --accent:#3fb37b; --accent-ink:#0b1a12; --accent-soft:#1d3327; --danger:#e0705f; --chip:#262a26;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:12px 16px calc(160px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.label button{font-size:12px;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600}
.amount-wrap{display:flex;align-items:center;gap:6px;font-size:40px;font-weight:700;letter-spacing:-.02em}
.amount-wrap span{color:var(--mute)}
.amount-wrap input{border:0;background:none;outline:none;width:100%;font-size:40px;font-weight:700;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--chip);font-size:15px;line-height:1.2;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.add{background:none;border:1px dashed var(--mute);color:var(--mute)}
.chip.ghost{background:none;border:1px solid var(--line);color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--chip);font-size:11.5px;text-align:center;line-height:1.15;min-height:72px;justify-content:center;border:1px solid transparent}
.cat b{font-size:24px;font-weight:400;line-height:1}
.cat.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.save{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 16px;pointer-events:none}
.save .inner{max-width:608px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.btn{flex:1;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;text-align:center}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:15px 18px}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger);flex:0 0 auto;padding:15px 18px}
.btn.small{padding:10px 14px;font-size:15px;flex:0 0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.monthnav h2{margin:0;font-size:18px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.mute{color:var(--mute)}
.small{font-size:13px}
.day{margin:16px 2px 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:600}
.entry{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.entry .em{font-size:22px;width:30px;text-align:center}
.entry .t{flex:1;min-width:0}
.entry .t div:first-child{font-weight:600}
.entry .t div:last-child{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .a{font-weight:700;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.bar{margin:10px 0}
.bar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.bar .h span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute);gap:4px}
.trend i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;opacity:.55}
.trend div.cur i{opacity:1}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list-row:last-child{border-bottom:0}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none;font-size:16px}
.field:focus{border-color:var(--accent)}
.opt{display:inline-flex;align-items:center;gap:4px;padding:7px 6px 7px 12px;border-radius:999px;background:var(--chip);font-size:14px}
.opt button{width:24px;height:24px;border-radius:50%;color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.auth{max-width:380px;margin:12vh auto 0;padding:0 16px}
.auth h1{font-size:30px;margin:0 0 4px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:8px 0}
.note-in{width:100%;border:0;background:none;outline:none;font-size:15px;padding:4px 0}
.date-in{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 10px;font-size:15px}
</style>
</head>

/* ---------------- Helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return dstr(d); };
const ymOf = s => s.slice(0,7);
const shiftYM = (ym, n) => { let [y,m]=ym.split("-").map(Number); m+=n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return `${y}-${pad(m)}`; };
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ymLabel = ym => { const [y,m]=ym.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; };
const daysInMonth = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); };

const inr0 = n => new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(n);

const clone = o => JSON.parse(JSON.stringify(o));
function lev(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n]; }
function fmtDay(s){ if(s===today()) return "Today"; if(s===yesterday()) return "Yesterday";

/* ---------------- Modal helpers (no alert/prompt) ---------------- */
function openSheet(html, onMount){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="sheet">${html}</div>`;
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  onMount && onMount(ov.querySelector(".sheet"), close);
  return close;
}
function askText({title, value="", placeholder="", ok="Save"}){
  return new Promise(res=>{
    openSheet(`<h3>${esc(title)}</h3><input class="field" id="askIn" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" autocapitalize="words">
      <div class="row" style="margin-top:12px"><button class="btn sec" id="askNo">Cancel</button><button class="btn" id="askOk">${esc(ok)}</button></div>`,
      (el,close)=>{ const i=el.querySelector("#askIn"); setTimeout(()=>i.focus(),50);
        const done=v=>{close();res(v)};
        el.querySelector("#askNo").onclick=()=>done(null);
        el.querySelector("#askOk").onclick=()=>done(norm(i.value)||null);
        i.onkeydown=e=>{ if(e.key==="Enter") done(norm(i.value)||null); };
      });
  });
}
function confirmBox(msg, {ok="Yes", no="Cancel", danger=false}={}){
  return new Promise(res=>{
    openSheet(`<h3>${msg}</h3><div class="row" style="margin-top:14px"><button class="btn sec" id="cNo">${esc(no)}</button><button class="btn" id="cOk" ${danger?'style="background:var(--danger)"':''}>${esc(ok)}</button></div>`,
      (el,close)=>{ el.querySelector("#cNo").onclick=()=>{close();res(false)}; el.querySelector("#cOk").onclick=()=>{close();res(true)}; });
  });
}

/* ---------------- Storage: this device ---------------- */
class LocalStore{
  constructor(){ this.key="kharcha_v1"; this.mem=null; this.mode="local"; }
  read(){ if(this.mem) return this.mem; let d=null; try{ d=JSON.parse(localStorage.getItem(this.key)); }catch(e){}
    this.mem = d || {config:clone(DEFAULT_CONFIG), expenses:{}}; this.mem.holdings ??= {}; return this.mem; }
  write(){ try{ localStorage.setItem(this.key, JSON.stringify(this.mem)); }catch(e){} }
  start(cb){ this.cb=cb; const d=this.read(); cb.onConfig(d.config); cb.onHoldings(Object.values(d.holdings)); cb.onExpenses(Object.values(d.expenses)); }
  putHolding(h){ this.mem.holdings[h.id]=h; this.write(); this.cb.onHoldings(Object.values(this.mem.holdings)); }
  deleteHolding(id){ delete this.mem.holdings[id]; this.write(); this.cb.onHoldings(Object.values(this.mem.holdings)); }
  emit(){ this.write(); this.cb.onExpenses(Object.values(this.mem.expenses)); }
  saveConfig(c){ this.mem.config=clone(c); this.write(); this.cb.onConfig(this.mem.config); }
  putExpense(e){ this.mem.expenses[e.id]=e; this.emit(); }
  deleteExpense(id){ delete this.mem.expenses[id]; this.emit(); }
  bulkUpdate(ups){ ups.forEach(u=>{ if(this.mem.expenses[u.id]) Object.assign(this.mem.expenses[u.id],u.changes); }); this.emit(); }
  importMany(list){ list.forEach(e=>this.mem.expenses[e.id]=e); this.emit(); }
}

/* ---------------- Storage: Firebase (sync) ---------------- */
class FirebaseStore{
  constructor(fb, user){ this.fb=fb; this.user=user; this.mode="cloud"; }
  start(cb){
    const {db, F}=this.fb, u=this.user.uid;
    this.cfgRef=F.doc(db,"users",u,"settings","config");
    this.col=F.collection(db,"users",u,"expenses");
    F.onSnapshot(this.cfgRef, snap=>{
      if(!snap.exists()){ if(!snap.metadata.fromCache){ F.setDoc(this.cfgRef, clone(DEFAULT_CONFIG)); } cb.onConfig(clone(DEFAULT_CONFIG)); }
      else cb.onConfig(snap.data());
    }, err=>{ console.error(err); toast("Sync error: "+err.code); });
    F.onSnapshot(this.col, {includeMetadataChanges:true}, snap=>{
      cb.onExpenses(snap.docs.map(d=>({id:d.id,...d.data()})), snap.metadata.hasPendingWrites);
    }, err=>{ console.error(err); toast("Sync error: "+err.code); });
    this.hcol=F.collection(db,"users",u,"holdings");
    F.onSnapshot(this.hcol, snap=>{ cb.onHoldings(snap.docs.map(d=>({id:d.id,...d.data()}))); }, err=>console.error(err));
  }
  putHolding(h){ const {id,...rest}=h; this.fb.F.setDoc(this.fb.F.doc(this.hcol,id), rest).catch(er=>toast("Couldn't save: "+er.code)); }
  deleteHolding(id){ this.fb.F.deleteDoc(this.fb.F.doc(this.hcol,id)).catch(er=>toast("Couldn't delete: "+er.code)); }
  saveConfig(c){ this.fb.F.setDoc(this.cfgRef, clone(c)).catch(e=>toast("Couldn't save: "+e.code)); }
  putExpense(e){ const {id,...rest}=e; this.fb.F.setDoc(this.fb.F.doc(this.col,id), rest).catch(er=>toast("Couldn't save: "+er.code)); }
  deleteExpense(id){ this.fb.F.deleteDoc(this.fb.F.doc(this.col,id)).catch(er=>toast("Couldn't delete: "+er.code)); }
  bulkUpdate(ups){ const F=this.fb.F;
    for(let i=0;i<ups.length;i+=400){ const b=F.writeBatch(this.fb.db);
      ups.slice(i,i+400).forEach(u=>b.update(F.doc(this.col,u.id),u.changes)); b.commit().catch(e=>toast("Couldn't update: "+e.code)); } }
  importMany(list){ const F=this.fb.F;
    for(let i=0;i<list.length;i+=400){ const b=F.writeBatch(this.fb.db);
      list.slice(i,i+400).forEach(e=>{ const {id,...rest}=e; b.set(F.doc(this.col,id),rest); }); b.commit().catch(er=>toast("Import failed: "+er.code)); } }
}

function blankForm(){ return {amount:"", catId:null, item:null, place:null, pay:S.stats?.topPay || (S.config?.payments[0]) || "UPI", date:today(), note:"", autoPlace:false}; }
const cat = id => S.config.categories.find(c=>c.id===id) || {id, emoji:"❔", name:"(deleted)", items:[], places:[], kind:"everyday"};

function computeStats(){
  const st={item:{}, place:{}, itemPlace:{}, itemPay:{}, pay:{}};
  const inc=(o,k)=>o[k]=(o[k]||0)+1;
  for(const e of S.expenses){
    inc(st.item, e.catId+"|"+e.item); if(e.place) inc(st.place, e.catId+"|"+e.place);
    if(e.place){ st.itemPlace[e.catId+"|"+e.item] ??= {}; inc(st.itemPlace[e.catId+"|"+e.item], e.place); }
    if(e.pay){ st.itemPay[e.catId+"|"+e.item] ??= {}; inc(st.itemPay[e.catId+"|"+e.item], e.pay); inc(st.pay,e.pay); }
  }
  const top=o=>o?Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]:null;
  st.top=top; st.topPay=top(st.pay);
  S.stats=st;
}
function sortedOpts(c, kind){
  const list=c[kind]||[], key=kind==="items"?"item":"place";
  return list.map((v,i)=>[v,(S.stats?.[key][c.id+"|"+v]||0),i]).sort((a,b)=>b[1]-a[1]||a[2]-b[2]).map(x=>x[0]);
}

function saveConfig(){ S.store.saveConfig(S.config); }

async function addOption(catId, kind, raw){
  const c=cat(catId); const v=tidy(raw); if(!v) return null;
  const list=c[kind];
  const exact=list.find(x=>ci(x)===ci(v)); if(exact) return exact;
  // catch likely typos against this category and all others
  const pool=[...new Set([...list, ...S.config.categories.flatMap(k=>k[kind])])];
  const near=pool.map(x=>[x,lev(x,v)]).filter(([x,d])=>d>0 && d<=Math.max(1,Math.floor(Math.min(x.length,v.length)/4))).sort((a,b)=>a[1]-b[1])[0];
  if(near){
    const useIt=await confirmBox(`Did you mean <b>${esc(near[0])}</b>?`,{ok:`Use “${near[0]}”`, no:`Keep “${v}”`});
    if(useIt){ if(!list.some(x=>ci(x)===ci(near[0]))){ list.push(near[0]); saveConfig(); } return near[0]; }
  }
  list.push(v); saveConfig(); return v;
}

function bars(rows, total, max=8){
  if(!rows.length) return `<div class="mute small">Nothing yet</div>`;
  const top=rows[0][1]||1;
  return rows.slice(0,max).map(([label,v,sub])=>`<div class="bar"><div class="h"><span>${label}</span><span><b>${inr0(v)}</b> <span class="mute small">${total?Math.round(v/total*100):0}%</span></span></div><div class="track"><div class="fill" style="width:${Math.max(2,v/top*100)}%"></div></div>${sub?`<div class="mute small" style="margin-top:3px">${sub}</div>`:""}</div>`).join("");
}
function viewInsights(){
  const filt = l => S.inclReimb ? l : l.filter(e=>cat(e.catId).kind!=="reimb");
  const list=filt(monthList(S.month)), prev=filt(monthList(shiftYM(S.month,-1)));
  const total=list.reduce((s,e)=>s+e.amount,0), ptotal=prev.reduce((s,e)=>s+e.amount,0);
  const isCur=S.month===ymOf(today());
  const days=isCur?new Date().getDate():daysInMonth(S.month);
  let h=monthNav();
  h+=`<label class="toggle" style="margin:-4px 2px 10px"><input type="checkbox" id="reimbT" ${S.inclReimb?"checked":""}> Include Work / Reimbursable</label>`;
  if(!list.length) return h+`<div class="empty">No expenses for ${ymLabel(S.month)} yet.<br>Add a few and your insights will show up here.</div>`;
  const diff = ptotal ? Math.round((total-ptotal)/ptotal*100) : null;
  const oneoff=list.filter(e=>cat(e.catId).kind==="oneoff").reduce((s,e)=>s+e.amount,0);

    <div class="stat"><div class="mute small">Daily average${isCur?" so far":""}</div><div class="v">${inr0(total/days)}</div></div>
    <div class="stat"><div class="mute small">Entries</div><div class="v">${list.length}</div></div></div>`;
  if(oneoff>0) h+=`<div class="card"><div class="label">Everyday vs one-off</div><div class="row" style="justify-content:space-between"><div><div class="mute small">Everyday</div><b>${inr0(total-oneoff)}</b></div><div style="text-align:right"><div class="mute small">One-off (furniture, gadgets, travel)</div><b>${inr0(oneoff)}</b></div></div><div class="track" style="height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:10px"><div class="fill" style="height:100%;background:var(--accent);width:${(total-oneoff)/total*100}%"></div></div></div>`;
  const sumBy=(fn)=>{ const o={}; list.forEach(e=>{ const k=fn(e); if(k) o[k]=(o[k]||[0,0]), o[k][0]+=e.amount, o[k][1]++; }); return Object.entries(o).sort((a,b)=>b[1][0]-a[1][0]); };
  const byCat=sumBy(e=>e.catId).map(([id,[v,n]])=>[`${cat(id).emoji} ${esc(cat(id).name)}`,v,`${n} ${n===1?"entry":"entries"}`]);
  h+=`<div class="card"><div class="label">By category</div>${bars(byCat,total,20)}</div>`;
  const byItem=sumBy(e=>e.catId+"|"+e.item).map(([k,[v,n]])=>{ const [id,it]=k.split(/\|(.*)/s); return [`${cat(id).emoji} ${esc(it)}`,v,`${n}× · avg ${inr0(v/n)}`]; });
  h+=`<div class="card"><div class="label">Top items</div>${bars(byItem,total,8)}</div>`;
  const byPlace=sumBy(e=>e.place).map(([p,[v,n]])=>[esc(p),v,`${n} ${n===1?"visit":"visits"}`]);
  if(byPlace.length) h+=`<div class="card"><div class="label">Where your money went</div>${bars(byPlace,total,8)}</div>`;
  const cabs=list.filter(e=>e.catId==="cabs").reduce((s,e)=>s+e.amount,0), fuel=list.filter(e=>e.catId==="fuel").reduce((s,e)=>s+e.amount,0);
  if(cabs&&fuel) h+=`<div class="card"><div class="label">Getting around</div><div class="row" style="justify-content:space-between"><div><div class="mute small">🚕 Cabs & commute</div><b>${inr0(cabs)}</b></div><div style="text-align:right"><div class="mute small">⛽ Own vehicle</div><b>${inr0(fuel)}</b></div></div></div>`;
  const byPay=sumBy(e=>e.pay).map(([p,[v,n]])=>[esc(p),v]);
  h+=`<div class="card"><div class="label">Paid via</div>${bars(byPay,total,8)}</div>`;
  const months=[...Array(6)].map((_,i)=>shiftYM(S.month,i-5));
  const mt=months.map(m=>filt(monthList(m)).reduce((s,e)=>s+e.amount,0)); const mx=Math.max(...mt,1);
  h+=`<div class="card"><div class="label">Last 6 months</div><div class="trend">${months.map((m,i)=>`<div class="${m===S.month?"cur":""}"><span>${mt[i]?short(mt[i]):""}</span><i style="height:${mt[i]/mx*80}%"></i>${MONTHS[Number(m.slice(5))-1]}</div>`).join("")}</div></div>`;
  return h;
}

      else if(t.id==="ceSave"){ sync(); if(!c.name) return toast("Give it a name");

function valueAt(h, dateStr){ // latest recorded value on or before date
  const hist=(h.history&&h.history.length?h.history:[{date:h.asOf||today(),value:h.value}]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let v=0; for(const p of hist){ if(p.date<=dateStr) v=+p.value; else break; } return v;
}

  if(H.some(x=>(x.history||[]).length>1) || mt.filter(Boolean).length>1)

function holdingsCSV(){
  const q=v=>{ v=String(v??""); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  const rows=[["Type","Held with","Name","Current value","Invested","As of"]];
  S.holdings.forEach(x=>rows.push([atype(x.type).name,x.inst,x.name,x.value,x.invested,x.asOf]));
  return rows.map(r=>r.map(q).join(",")).join("\n");
}

/* ---------------- CSV ---------------- */
function toCSV(){
  const q=v=>{ v=String(v??""); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  const rows=[["Date","Amount","Category","Item","Place","Paid via","Note","Type"]];
  [...S.expenses].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{ const c=cat(e.catId); rows.push([e.date,e.amount,c.name,e.item,e.place,e.pay,e.note,c.kind]); });
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===","){row.push(f);f=""} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; } else f+=ch; }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importCSV(file){
  const rows=parseCSV(await file.text()); const head=rows.shift()?.map(h=>ci(h))||[];
  const ix=n=>head.indexOf(n); const I={date:ix("date"),amount:ix("amount"),cat:ix("category"),item:ix("item"),place:ix("place"),pay:ix("paid via"),note:ix("note")};
  if(I.date<0||I.amount<0||I.cat<0||I.item<0) return toast("CSV needs Date, Amount, Category, Item columns");
  const out=[]; let cfgChanged=false;
  for(const r of rows){ const amt=parseFloat(r[I.amount]); if(!(amt>0)||!/^\d{4}-\d{2}-\d{2}$/.test(r[I.date])) continue;
    let c=S.config.categories.find(k=>ci(k.name)===ci(r[I.cat]));
    if(!c){ c={id:"c"+uid(),emoji:"🏷️",name:tidy(r[I.cat])||"Other",kind:"everyday",items:[],places:[]}; S.config.categories.splice(S.config.categories.length-1,0,c); cfgChanged=true; }
    const item=tidy(r[I.item])||"Miscellaneous", place=I.place>=0?tidy(r[I.place]):"";
    if(!c.items.some(x=>ci(x)===ci(item))){c.items.push(item);cfgChanged=true}
    if(place&&!c.places.some(x=>ci(x)===ci(place))){c.places.push(place);cfgChanged=true}
    out.push({id:uid()+out.length,amount:amt,date:r[I.date],catId:c.id,item,place,pay:I.pay>=0?norm(r[I.pay]):"",note:I.note>=0?norm(r[I.note]):"",created:Date.now(),updated:Date.now()}); }
  if(!out.length) return toast("No valid rows found");
  if(!await confirmBox(`Import ${out.length} expenses?`,{ok:"Import"})) return;
  if(cfgChanged) saveConfig(); S.store.importMany(out); toast(`Imported ${out.length}`); render();
}

  onHoldings(list){ S.holdings=list; if(S.config&&!document.querySelector(".overlay")) render(); },
  onConfig(c){ S.config=c; if(!S.config.payments) S.config.payments=clone(DEFAULT_CONFIG.payments);
    if(!S.config.assetTypes){ S.config.assetTypes=clone(DEFAULT_ASSET_TYPES); S.store&&S.store.saveConfig(S.config); } computeStats(); if(!document.querySelector(".overlay")||S.tab!=="add") render(); },
  onExpenses(list, pending=false){ S.expenses=list; S.pending=pending; computeStats(); if(!document.querySelector(".overlay")) render(); else { const s=document.querySelector(".sync"); } }
};

function authScreen(err=""){
  $("#app").innerHTML=`<div class="auth"><h1>Kharcha</h1><p class="mute">Sign in to sync your expenses across iPhone, iPad and Mac.</p>
    <input class="field" id="em" type="email" placeholder="Email" autocomplete="email" style="margin-top:14px">
    <input class="field" id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" style="margin-top:8px">
    <div class="err" id="err">${esc(err)}</div>
    <button class="btn" id="si" style="width:100%">Sign in</button>
    <button class="btn sec" id="su" style="width:100%;margin-top:8px">Create account (first time)</button>
    <button id="fp" style="margin-top:14px;color:var(--accent);font-size:14px;width:100%">Forgot password?</button></div>`;
  const {A,auth}=S.fb, em=$("#em"), pw=$("#pw"), er=$("#err");
  const msg=e=>({"auth/invalid-credential":"Wrong email or password","auth/email-already-in-use":"Account exists — use Sign in","auth/weak-password":"Password needs 6+ characters","auth/invalid-email":"Check the email address","auth/network-request-failed":"No internet connection","auth/operation-not-allowed":"Turn on Email/Password sign-in in Firebase (see guide)"}[e.code]||e.message);
  $("#si").onclick=()=>A.signInWithEmailAndPassword(auth,em.value.trim(),pw.value).catch(e=>er.textContent=msg(e));
  $("#su").onclick=()=>A.createUserWithEmailAndPassword(auth,em.value.trim(),pw.value).catch(e=>er.textContent=msg(e));
  $("#fp").onclick=()=>{ if(!em.value.trim()) return er.textContent="Type your email first"; A.sendPasswordResetEmail(auth,em.value.trim()).then(()=>er.textContent="Reset link sent to your email").catch(e=>er.textContent=msg(e)); };
}

async function boot(){
  if(!FIREBASE_CONFIG){ S.store=new LocalStore(); S.store.start(callbacks); return; }
  try{
    const {App,A,F}=await import("./fb.js");
    const app=App.initializeApp(FIREBASE_CONFIG);
    const auth=A.initializeAuth(app,{persistence:[A.indexedDBLocalPersistence,A.browserLocalPersistence]});
    let db; try{ db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ db=F.getFirestore(app); }
    S.fb={App,A,F,app,auth,db};
    A.onAuthStateChanged(auth,user=>{
      if(!user){ S.user=null; S.store=null; S.config=null; S.expenses=[]; authScreen(); return; }
      S.user=user; S.store=new FirebaseStore(S.fb,user); S.store.start(callbacks);
    });
  }catch(e){
    console.error(e);
    $("#app").innerHTML=`<div class="empty">Couldn't load sync (are you offline on first launch?).<br><br><button class="btn small" onclick="location.reload()">Retry</button></div>`;
  }
}
boot();

if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
